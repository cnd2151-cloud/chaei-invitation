<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="format-detection" content="telephone=no" />
    <title>%SHARE_TITLE%</title>
    <meta name="description" content="%SHARE_DESC%" />

    <!-- Open Graph (카카오톡 · 메신저 링크 미리보기) — 값은 src/config.ts 의 share 항목에서 빌드 시 자동 입력 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SHARE_TITLE%" />
    <meta property="og:description" content="%SHARE_DESC%" />
    <meta property="og:image" content="%SHARE_IMAGE%" />
    <meta property="og:image:width" content="%SHARE_IMAGE_W%" />
    <meta property="og:image:height" content="%SHARE_IMAGE_H%" />
    <meta property="og:url" content="%SHARE_URL%" />
    <meta property="og:site_name" content="%SHARE_TITLE%" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SHARE_TITLE%" />
    <meta name="twitter:description" content="%SHARE_DESC%" />
    <meta name="twitter:image" content="%SHARE_IMAGE%" />
    <link rel="canonical" href="%SHARE_URL%" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Gowun+Batang:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 첫 화면 이미지 미리 불러오기 -->
    <link rel="preload" as="image" href="/images/main/baby.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 초대장은 JavaScript가 필요합니다.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
